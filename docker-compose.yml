version: '3.8'

services:
  xiyan-mcp-server:
    build: .
    # 不固定 container_name，允许 Compose 水平扩容
    # 每个容器保持单 worker，HTTP 扩容通过增加副本完成
    ports:
      - "8000:8000"
    command: ["python", "-m", "xiyan_mcp_server", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]

    # 挂载配置文件
    volumes:
      - ./src/xiyan_mcp_server/config.yml:/app/src/xiyan_mcp_server/config.yml:ro

    # 环境变量
    environment:
      - PYTHONUNBUFFERED=1

    # 健康检查：考虑初始化失败和 draining 状态
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    # 服务 graceful timeout: 40s，容器 stop grace: 45s
    stop_grace_period: 45s

    restart: unless-stopped

    # 如果需要依赖其他服务（如 Redis、数据库），可以在这里添加
    # depends_on:
    #   - redis
    #   - greptimedb

  # Redis 服务（可选，如果需要）
