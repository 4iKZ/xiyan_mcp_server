name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . "pytest>=8.0" "pytest-asyncio>=0.23" "pytest-cov>=5.0"

      - name: Prepare test config
        run: cp src/xiyan_mcp_server/config.example.yml src/xiyan_mcp_server/config.yml

      - name: Run unit tests
        run: pytest
